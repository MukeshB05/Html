
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GDL LIVE TV</title>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-CLRHYY0QJ9"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-CLRHYY0QJ9');
    </script>

    <!-- Push Notifications -->
    <script src="https://notification.gdls.me/cdn-sdk/push-sdk.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', function() {
        PushPort.init({
          websiteId: 'GVS2AKBM9',
          serviceWorkerPath: '/service-worker.js',
          apiUrl: 'https://notification.gdls.me',
          autoRegister: true
        });
      });
    </script>

    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0d0d0d;
            color: #eee;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: #111;
            border-bottom: 1px solid #222;
        }
        .header h1 {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.3px;
            color: #fff;
        }
        .header .tg-link {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 12px;
            font-weight: 600;
            color: #229ed9;
            text-decoration: none;
            padding: 5px 10px;
            border-radius: 20px;
            background: rgba(34,158,217,0.1);
            transition: background 0.2s;
        }
        .header .tg-link:hover {
            background: rgba(34,158,217,0.2);
        }
        .header .live-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 11px;
            font-weight: 600;
            color: #ff4444;
            background: rgba(255,68,68,0.12);
            padding: 4px 10px;
            border-radius: 20px;
            text-transform: uppercase;
        }
        .header .live-badge::before {
            content: '';
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #ff4444;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 12px;
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
        }

        .player-wrapper {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
            box-shadow: 0 4px 30px rgba(0,0,0,0.6);
            position: relative;
        }
        .player-wrapper video {
            width: 100%;
            display: block;
            aspect-ratio: 16 / 9;
        }

        .info-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px 16px;
            margin-top: 12px;
            padding: 10px 14px;
            background: #1a1a1a;
            border-radius: 10px;
            border: 1px solid #2a2a2a;
            font-size: 13px;
        }
        .info-bar .label {
            color: #888;
        }
        .info-bar .value {
            color: #eee;
            font-weight: 500;
        }
        .info-bar .sep {
            width: 1px;
            height: 16px;
            background: #333;
        }

        .qualities {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 0;
            margin-left: auto;
        }
        .qualities .q-chip {
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 6px;
            background: #2a2a2a;
            color: #aaa;
            border: 1px solid #333;
        }
        .qualities .q-chip.active {
            background: #1a5fff;
            color: #fff;
            border-color: #1a5fff;
        }

        .section-title {
            font-size: 14px;
            font-weight: 600;
            margin: 20px 0 10px;
            color: #ccc;
        }

        .controls-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 8px;
            margin-bottom: 20px;
        }
        .controls-info .item {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 10px;
            padding: 12px;
            text-align: center;
        }
        .controls-info .item .icon {
            font-size: 20px;
            margin-bottom: 4px;
        }
        .controls-info .item .text {
            font-size: 12px;
            color: #999;
        }

        .footer {
            text-align: center;
            padding: 16px;
            font-size: 12px;
            color: #555;
            border-top: 1px solid #1a1a1a;
            margin-top: auto;
        }

        @media (max-width: 480px) {
            .header { padding: 10px 12px; }
            .header h1 { font-size: 14px; }
            .main { padding: 8px; }
            .player-wrapper { border-radius: 8px; }
            .info-bar { flex-direction: column; align-items: flex-start; gap: 6px; }
            .qualities { margin-left: 0; }
            .controls-info { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
    <header class="header">
        <h1>GDL LIVE TV</h1>
        <a href="https://gdls.me/JOINus" target="_blank" rel="noopener" class="tg-link">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2.5L2.5 10.5L9.5 14.5L13.5 21.5L21.5 2.5Z"/><path d="M9.5 14.5L20.5 4.5"/></svg>
            Follow
        </a>
        <span class="live-badge">Live</span>
    </header>

    <div class="main">
        <div class="player-wrapper">
            <video id="player" controls crossorigin playsinline></video>
        </div>

        <div class="info-bar">
            <span class="label">Stream</span>
            <span class="value" id="streamStatus">Connecting...</span>
            <span class="sep"></span>
            <span class="label">Quality</span>
            <span class="value" id="currentQuality">Loading...</span>
            <div class="qualities" id="qualityChips"></div>
        </div>

        <div class="section-title">Controls</div>
        <div class="controls-info">
            <div class="item">
                <div class="icon">&#9881;</div>
                <div class="text">Settings - Quality, Speed & Captions</div>
            </div>
            <div class="item">
                <div class="icon">&#10697;</div>
                <div class="text">Tap video for play/pause</div>
            </div>
            <div class="item">
                <div class="icon">&#9974;</div>
                <div class="text">Fullscreen support</div>
            </div>
            <div class="item">
                <div class="icon">&#128266;</div>
                <div class="text">Volume & mute control</div>
            </div>
        </div>
    </div>

    <footer class="footer">
        &copy; 2026 GDL LIVE TV &mdash; All rights reserved
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const video = document.getElementById('player');
            const source = 'https://foxdtc-video.akamaized.net/ZXhwPTE3ODQ1Njk4MTc7YWNsPS8qO3dzaWQ9ZGMxZjljNTI3YmNiYWM3MTY5ZDA4ZDgyNjBkMDg2ZjNfZm94ZHRjX3dlYl9lbi1VUztobWFjPVBvcFdWWUpTMERKUjNMTEVZOWZDOVFFVDhKbklzSFpBaWRSMnBVaXRtVTA9/live/tx001-ue2/index.m3u8';
            const streamStatus = document.getElementById('streamStatus');
            const currentQuality = document.getElementById('currentQuality');
            const qualityChips = document.getElementById('qualityChips');

            const defaultOptions = {
                autoplay: true,
                muted: true,
                controls: [
                    'play-large', 'play', 'progress', 'current-time', 'mute',
                    'volume', 'captions', 'settings', 'pip', 'airplay', 'fullscreen'
                ],
                settings: ['captions', 'quality', 'speed'],
            };

            function updateQualityChips(levels, activeLevel) {
                qualityChips.innerHTML = '';
                const autoChip = document.createElement('span');
                autoChip.className = 'q-chip' + (activeLevel === -1 ? ' active' : '');
                autoChip.textContent = 'Auto';
                autoChip.addEventListener('click', () => {
                    window.hls.currentLevel = -1;
                    currentQuality.textContent = 'Auto';
                    updateQualityChips(levels, -1);
                });
                qualityChips.appendChild(autoChip);

                levels.forEach((level, i) => {
                    const chip = document.createElement('span');
                    chip.className = 'q-chip' + (activeLevel === i ? ' active' : '');
                    chip.textContent = level.height ? level.height + 'p' : '~' + Math.round(level.bitrate / 1000) + 'k';
                    chip.addEventListener('click', () => {
                        window.hls.currentLevel = i;
                        currentQuality.textContent = level.height ? level.height + 'p' : Math.round(level.bitrate / 1000) + 'kbps';
                        updateQualityChips(levels, i);
                    });
                    qualityChips.appendChild(chip);
                });
            }

            if (Hls.isSupported()) {
                const hls = new Hls();
                hls.loadSource(source);
                hls.attachMedia(video);

                hls.on(Hls.Events.MANIFEST_PARSED, (event, data) => {
                    const levels = hls.levels;

                    const sorted = levels
                        .map((l, i) => ({ index: i, height: l.height || Infinity }))
                        .filter(l => l.height !== Infinity)
                        .sort((a, b) => a.height - b.height);
                    let defaultLevelIndex = -1;
                    if (sorted.length > 0) {
                        let closest = sorted[0];
                        for (const l of sorted) {
                            if (Math.abs(l.height - 360) < Math.abs(closest.height - 360)) {
                                closest = l;
                            }
                        }
                        defaultLevelIndex = closest.index;
                    }
                    const defaultHeight = defaultLevelIndex >= 0 ? levels[defaultLevelIndex].height : null;
                    hls.currentLevel = defaultLevelIndex;

                    const availableQualities = levels.map(l => l.height);
                    availableQualities.unshift(0);

                    defaultOptions.quality = {
                        default: defaultHeight || 0,
                        options: availableQualities,
                        forced: true,
                        onChange: (e) => {
                            if (e === 0) {
                                hls.currentLevel = -1;
                                currentQuality.textContent = 'Auto';
                            } else {
                                hls.levels.forEach((level, idx) => {
                                    if (level.height === e) {
                                        hls.currentLevel = idx;
                                        currentQuality.textContent = level.height + 'p';
                                    }
                                });
                            }
                        },
                    };
                    defaultOptions.i18n = { qualityLabel: { 0: 'Auto' } };

                    const player = new Plyr(video, defaultOptions);
                    window.player = player;

                    streamStatus.textContent = 'Live';
                    currentQuality.textContent = defaultHeight ? defaultHeight + 'p' : 'Auto';
                    updateQualityChips(levels, defaultLevelIndex);

                    hls.on(Hls.Events.LEVEL_SWITCHED, (e, data) => {
                        const level = levels[data.level];
                        currentQuality.textContent = level ? level.height + 'p' : 'Auto';
                        updateQualityChips(levels, data.level);
                    });

                    player.play();
                });

                hls.on(Hls.Events.ERROR, (event, data) => {
                    if (data.fatal) {
                        streamStatus.textContent = 'Error: ' + data.type;
                    }
                });

                window.hls = hls;

            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = source;
                video.addEventListener('loadedmetadata', () => {
                    new Plyr(video, defaultOptions);
                    streamStatus.textContent = 'Live';
                });
            }
        });
    </script>
</body>
</html>
